server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Must equal UploadLimits.MaxRequestBytes in the API (64 MiB for the whole multipart request; the API itself
    # enforces 10 MiB per file). The Nginx default of 1m would reject ordinary statements with a bare 413 page.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
